# Publish: manual only (Actions › Publish › Run workflow).
# Only sessions and exercises marked "published": true in course.json are included.
#
# Modes:
#   dry-run    Build out/ and keep it as the "publish-preview" artifact. Nothing is pushed.
#   test-here  Deploy the public site (out/site) to GitHub Pages of THIS repo.
#              One-time setup: Settings › Pages › Source: GitHub Actions.
#              URL: https://<user>.github.io/<this-repo>/
#   publish    Real release to the public repo:
#                site          → gh-pages branch (GitHub Pages)
#                student files → main branch (exercise statements, starter, check, course policy)
#              One-time setup: PUBLIC_DEPLOY_KEY secret and publicRepo in course.json (see README).
name: Publish
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run: build only | test-here: Pages of this repo | publish: public repo'
        type: choice
        options: [dry-run, test-here, publish]
        default: dry-run
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run images
      - run: node scripts/publish.mjs
      - id: target
        run: echo "repo=$(node -p "require('./course.json').publicRepo")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: publish-preview
          path: out
          retention-days: 7
      - if: ${{ inputs.mode == 'test-here' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
      - name: Check publish prerequisites
        if: ${{ inputs.mode == 'publish' }}
        env:
          KEY: ${{ secrets.PUBLIC_DEPLOY_KEY }}
          REPO: ${{ steps.target.outputs.repo }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Secret PUBLIC_DEPLOY_KEY is not set (see README)."; exit 1; }
          case "$REPO" in OWNER/*|"") echo "::error::publicRepo in course.json is still a placeholder: $REPO"; exit 1;; esac
      - name: Site → gh-pages
        if: ${{ inputs.mode == 'publish' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PUBLIC_DEPLOY_KEY }}
          external_repository: ${{ steps.target.outputs.repo }}
          publish_branch: gh-pages
          publish_dir: out/site
          force_orphan: true
      - name: Student files → main
        if: ${{ inputs.mode == 'publish' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PUBLIC_DEPLOY_KEY }}
          external_repository: ${{ steps.target.outputs.repo }}
          publish_branch: main
          publish_dir: out/repo
          enable_jekyll: true
          commit_message: "Publish from private repo"
  test-here:
    needs: publish
    if: ${{ inputs.mode == 'test-here' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
