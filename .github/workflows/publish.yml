# انتشار: فقط با اجرای دستی (Actions › Publish › Run workflow).
# فقط جلسه‌ها و تمرین‌هایی که در course.json با published: true آمده‌اند به مخزن عمومی می‌روند:
#   سایت → شاخهٔ gh-pages مخزن عمومی (GitHub Pages)
#   فایل‌های دانشجو (صورت تمرین، starter، check، قواعد درس) → شاخهٔ main مخزن عمومی
# پیش‌نیاز یک‌باره: کلید PUBLIC_DEPLOY_KEY (راهنما در README).
# حالت‌ها (mode):
#   dry-run   فقط out/ ساخته و به‌صورت artifact به نام publish-preview نگه داشته می‌شود.
#   test-here سایت عمومی (out/site) روی GitHub Pages همین مخزن می‌رود، نه مخزن عمومی.
#             پیش‌نیاز: Settings › Pages › Source: GitHub Actions. آدرس: https://<کاربر>.github.io/<این مخزن>/
#   publish   انتشار واقعی در مخزن عمومی.
name: Publish
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run: فقط بساز | test-here: Pages همین مخزن | publish: مخزن عمومی'
        type: choice
        options: [dry-run, test-here, publish]
        default: dry-run
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run images
      - run: node scripts/publish.mjs
      - id: target
        run: echo "repo=$(node -p "require('./course.json').publicRepo")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: publish-preview
          path: out
          retention-days: 7
      - if: ${{ inputs.mode == 'test-here' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
      - name: بررسی پیش‌نیازهای انتشار
        if: ${{ inputs.mode == 'publish' }}
        env:
          KEY: ${{ secrets.PUBLIC_DEPLOY_KEY }}
          REPO: ${{ steps.target.outputs.repo }}
        run: |
          [ -n "$KEY" ] || { echo "::error::سکرت PUBLIC_DEPLOY_KEY تعریف نشده (راهنما در README)."; exit 1; }
          case "$REPO" in OWNER/*|"") echo "::error::publicRepo در course.json هنوز مقدار نمونه است: $REPO"; exit 1;; esac
      - name: سایت → gh-pages
        if: ${{ inputs.mode == 'publish' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PUBLIC_DEPLOY_KEY }}
          external_repository: ${{ steps.target.outputs.repo }}
          publish_branch: gh-pages
          publish_dir: out/site
          force_orphan: true
      - name: فایل‌های دانشجو → main
        if: ${{ inputs.mode == 'publish' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PUBLIC_DEPLOY_KEY }}
          external_repository: ${{ steps.target.outputs.repo }}
          publish_branch: main
          publish_dir: out/repo
          enable_jekyll: true
          commit_message: "انتشار از مخزن خصوصی"
  test-here:
    needs: publish
    if: ${{ inputs.mode == 'test-here' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
